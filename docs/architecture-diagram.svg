  </g>

  <!-- Box 1: Principal Investigator / Persona Multi-Tenant Layer (Top Left) -->
  <g transform="translate(60, 120)">
    <rect width="320" height="150" rx="12" fill="#131d31" stroke="#2563eb" stroke-width="1.5" filter="url(#glow)" />
    <rect width="320" height="32" rx="12" fill="#1e293b" />
    <text x="16" y="21" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1">1. MULTI-TENANT PI WORKSPACES</text>
    <text x="16" y="58" font-size="13" font-weight="700" fill="#f8fafc">Dr. Elena Rossi / Dr. Marcus Chen / Blank Lab</text>
    <text x="16" y="78" font-size="11" fill="#94a3b8">• Scoped by userId across all tables &amp; caches</text>
