    <text x="16" y="96" font-size="11" fill="#94a3b8">• Quiet-by-Default: nominal runs log silent heartbeats</text>
    <text x="16" y="114" font-size="11" fill="#94a3b8">• Wake-on-Risk: interrupts only when action required</text>
    <rect x="16" y="126" width="130" height="16" rx="4" fill="#10b981" fill-opacity="0.2" />
